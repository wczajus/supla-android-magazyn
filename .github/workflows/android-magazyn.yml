name: SUPLA Magazyn APK

on:
  push:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magazyn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDK_MANAGER" 'platforms;android-37' 'build-tools;36.0.0'
      - name: Configure test build
        shell: bash
        run: |
          cp app/drone.google-services.json app/google-services.json
          cp app/src/internaltest/drone.google-services.json app/src/internaltest/google-services.json
          cp app/src/internalTestRelease/drone.google-services.json app/src/internalTestRelease/google-services.json
          mkdir -p "$HOME/.android"
          base64 --decode ci/test-signing.p12.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          chmod +x gradlew
      - name: Build and run unit tests
        run: ./gradlew :app:assembleInternaltest :app:testDebugUnitTest -PmagazynVersionCode=$((10000 + GITHUB_RUN_NUMBER)) --stacktrace --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g
      - name: Prepare universal APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/internaltest/*universal*.apk dist/supla-magazyn.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/supla-magazyn.apk
          (cd dist && sha256sum supla-magazyn.apk > supla-magazyn.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: supla-magazyn-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  prerelease:
    if: github.event_name == 'push' && github.repository == 'wczajus/supla-android-magazyn'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: supla-magazyn-apk
          path: dist
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          printf 'Testowa wersja SUPLA Magazyn.\n\nGałąź: %s\nCommit: %s\n\nInstaluj supla-magazyn.apk. Aplikacja działa obok oficjalnej SUPLI.\n' "$BUILD_BRANCH" "$BUILD_SHA" > notes.md
          gh release create "magazyn-build-$BUILD_NUMBER" dist/supla-magazyn.apk dist/supla-magazyn.apk.sha256 --target "$BUILD_SHA" --title "SUPLA Magazyn — build $BUILD_NUMBER" --notes-file notes.md --prerelease --latest=false
