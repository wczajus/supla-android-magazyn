name: SUPLA Magazyn Release APK

on:
  push:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magazyn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test build retention
        run: node --test ci/retain-build-artifacts.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDK_MANAGER" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Configure test build
        shell: bash
        run: |
          cp app/drone.google-services.json app/google-services.json
          cp app/src/internaltest/drone.google-services.json app/src/internaltest/google-services.json
          cp app/src/internalTestRelease/drone.google-services.json app/src/internalTestRelease/google-services.json
          mkdir -p .gradle
          base64 --decode ci/test-signing.p12.b64 > .gradle/magazyn-test-signing.p12
          chmod 600 .gradle/magazyn-test-signing.p12
          chmod +x gradlew
      - name: Build and run unit tests
        run: ./gradlew :app:spotlessCheck :app:assembleInternalTestRelease :app:testInternalTestReleaseUnitTest -PmagazynVersionCode=$((10000 + GITHUB_RUN_NUMBER)) --stacktrace --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g
      - name: Prepare universal APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/internalTestRelease/*universal*.apk dist/supla-magazyn.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/supla-magazyn.apk | tee dist/signature.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: 5f166d6c18942ba593ed09f125ea24982aa6e2ea2f841d2788c26cd39cbd32c0' dist/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/supla-magazyn.apk > dist/apk-metadata.txt
          grep -Fq "package: name='org.supla.android.t'" dist/apk-metadata.txt
          grep -Fq "application-label:'SUPLA Magazyn'" dist/apk-metadata.txt
          if grep -q '^application-debuggable' dist/apk-metadata.txt; then
            echo 'Release APK must not be debuggable' >&2
            exit 1
          fi
          (cd dist && sha256sum supla-magazyn.apk > supla-magazyn.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: supla-magazyn-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.repository == 'wczajus/supla-android-magazyn'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: supla-magazyn-apk
          path: dist
      - name: Publish release APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          printf 'SUPLA Magazyn — APK release (niedebugowalna).\n\nGałąź: %s\nCommit: %s\n\nInstaluj supla-magazyn.apk. Zachowano podpis i identyfikator aplikacji umożliwiający aktualizację poprzedniej wersji.\n' "$BUILD_BRANCH" "$BUILD_SHA" > notes.md
          RELEASE_OPTIONS=(--prerelease --latest=false)
          if [ "$BUILD_BRANCH" = master ]; then
            RELEASE_OPTIONS=(--latest)
          fi
          gh release create "magazyn-build-$BUILD_NUMBER" dist/supla-magazyn.apk dist/supla-magazyn.apk.sha256 --target "$BUILD_SHA" --title "SUPLA Magazyn — release $BUILD_NUMBER" --notes-file notes.md "${RELEASE_OPTIONS[@]}"

  cleanup:
    needs: [build, publish]
    if: >-
      always() && github.repository == 'wczajus/supla-android-magazyn' &&
      needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    concurrency:
      group: magazyn-build-file-retention
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Keep files from the two newest successful builds
        uses: actions/github-script@v8
        with:
          script: |
            await require('./ci/retain-build-artifacts.cjs')({ github, context, core });
